[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ZSS"
version = "0.4.2"
description = "Desktop SunCalc application with 3D visualization, built on top of suncalc-py"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Kyle Barron", email = "kylebarron2@gmail.com"},
  {name = "Repository maintainer"}
]
keywords = ["sun", "moon", "astronomy", "shadow", "qt", "visualization"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "requests>=2.31",
]

[project.optional-dependencies]
desktop = [
  "PySide6>=6.6",
  "matplotlib>=3.8",
]
data = [
  "xarray>=2024.1.0",
  "cdsapi>=0.7.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.6.0",
]

[project.scripts]
suncalc-gui = "main:main"

[project.urls]
Homepage = "https://github.com/kylebarron/suncalc-py"
Repository = "https://github.com/kylebarron/suncalc-py"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["suncalc*", "app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["docs/assets"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"suncalc/__init__.py" = ["F401"]
"suncalc/suncalc.py" = ["E741"]
"tests/test_gui_helpers.py" = ["E402"]
