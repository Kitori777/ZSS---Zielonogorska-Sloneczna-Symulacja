[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "SS"
version = "0.1.0"
description = "Desktop SunCalc application with 3D visualization, built on top of suncalc-py"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Kyle Barron", email = "kylebarron2@gmail.com"},
  {name = "Repository maintainer"}
]
keywords = ["sun", "moon", "astronomy", "shadow", "qt", "visualization"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
]

[project.optional-dependencies]
desktop = [
  "PySide6>=6.6",
  "matplotlib>=3.8",
]
data = [
  "xarray>=2024.1.0",
  "cdsapi>=0.7.0",
]
test = [
  "pytest>=8.0",
]

[project.scripts]
suncalc-gui = "main:main"

[project.urls]
Homepage = "https://github.com/kylebarron/suncalc-py"
Repository = "https://github.com/kylebarron/suncalc-py"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["suncalc*", "app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
