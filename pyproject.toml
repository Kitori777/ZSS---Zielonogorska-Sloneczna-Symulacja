[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ZSS"
version = "0.5.0"
description = "Zielonogorska Sloneczna Symulacja desktop app with 3D solar, shadow and weather visualization"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Kyle Barron", email = "kylebarron2@gmail.com"},
  {name = "Repository maintainer"}
]
keywords = ["sun", "moon", "astronomy", "shadow", "weather", "qt", "visualization"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.24",
  "pandas>=2.0",
  "requests>=2.31",
  "scipy>=1.12",
]

[project.optional-dependencies]
desktop = [
  "PySide6>=6.6",
]
data = [
  "xarray>=2024.1.0",
  "cdsapi>=0.7.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.6.0",
]

[project.scripts]
zss-gui = "falubaz_track_model.zss:main"
falubaz-zss = "falubaz_track_model.zss:main"

[project.urls]
Homepage = "https://github.com/Kitori777/ZSS---Zielonogorska-Sloneczna-Symulacja"
Repository = "https://github.com/Kitori777/ZSS---Zielonogorska-Sloneczna-Symulacja"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["falubaz_track_model*"]

[tool.setuptools.package-data]
"falubaz_track_model.zss" = ["data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["docs/assets", "data", ".local"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"falubaz_track_model/zss/_vendor/suncalc/__init__.py" = ["F401"]
"falubaz_track_model/zss/_vendor/suncalc/suncalc.py" = ["E741"]
"tests/test_zss_gui_helpers.py" = ["E402"]
